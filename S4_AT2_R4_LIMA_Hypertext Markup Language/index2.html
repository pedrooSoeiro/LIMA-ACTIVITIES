<!DOCTYPE html>
<html lang="pt-br">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página web de uma loja especializada em hardware e periféricos para gamers e eSports.">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>PixelGear eSports Store</title>
 </head>

 <fieldset>
    <legend> Escolha o produto desejado </legend>
    <select name ="produtos" id="produtos">
        <option value="placa_de_video">Placa de Vídeo</option>
        <option value="processador">Processador</option>
        <option value="placa_mae">Placa Mãe</option>
        <option value="memoria_ram">Memória RAM</option>
        <option value="ssd">SSD</option>
        <option value="hd">HD</option>
        <option value="fonte">Fonte de Alimentação</option>
        <option value="gabinete">Gabinete</option>
        <option value="cooler">Cooler</option>
        <option value="monitor">Monitor</option>
        <option value="teclado">Teclado</option>
        <option value="mouse">Mouse</option>
        <option value="headset">Headset</option>
    </select>
 </fieldset>

 <P>
    <strong> O PC que deseja é para jogos? </strong>>
    <input type="radio" name="jogos" id="jogos" placeholder="Digite sim ou não">
    <label for="jogos">Sim</label>
    <input type="radio" name="jogos" id="nao_jogos" placeholder="Digite sim ou não">
    <label for="nao_jogos">Não</label>

 </P>
